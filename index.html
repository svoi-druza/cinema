<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎬 Кинотеатр с друзьями</title>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0d0f14; color: #e6e6e6; min-height: 100vh; }
    .screen { display: none; min-height: 100vh; }
    .screen.active { display: block; }
    #loginScreen { display: none; align-items: center; justify-content: center; padding: 20px; }
    #loginScreen.active { display: flex; }
    .login-card { background: linear-gradient(160deg, #1a1e28, #13161d); border: 1px solid #2a2f3a; border-radius: 20px; padding: 40px 32px; width: 100%; max-width: 380px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
    .login-card h1 { font-size: 28px; margin-bottom: 6px; }
    .subtitle { color: #8a93a6; font-size: 14px; margin-bottom: 24px; }
    .avatar-preview { width: 90px; height: 90px; border-radius: 50%; background: #232835; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; font-size: 36px; color: #5a6272; overflow: hidden; border: 2px solid #333a49; background-size: cover; background-position: center; }
    .login-card input[type="text"] { width: 100%; padding: 13px 16px; border-radius: 10px; border: 1px solid #2c3240; background: #151922; color: #fff; font-size: 15px; margin-bottom: 14px; outline: none; }
    .login-card input[type="text"]:focus { border-color: #4f8cff; }
    .file-label { display: block; font-size: 13px; color: #8a93a6; margin-bottom: 20px; cursor: pointer; }
    .file-label:hover { color: #4f8cff; }
    #enterBtn { width: 100%; padding: 14px; border: none; border-radius: 10px; background: linear-gradient(90deg, #4f8cff, #7a5cff); color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
    .menu-header { padding: 24px 32px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; border-bottom: 1px solid #1e232e; }
    .menu-header h2 { font-size: 20px; font-weight: 600; color: #aab3c5; }
    .user-info { display: flex; align-items: center; gap: 10px; font-weight: 600; }
    .avatar-sm { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; background: #232835; }
    .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; padding: 32px; }
    .movie-card { background: #161a23; border: 1px solid #232937; border-radius: 14px; overflow: hidden; cursor: pointer; transition: transform 0.2s; }
    .movie-card:hover { transform: translateY(-4px); border-color: #4f8cff; }
    .movie-poster { width: 100%; aspect-ratio: 2/3; object-fit: cover; background: #0f1218; display: block; }
    .movie-poster.placeholder { display: flex; align-items: center; justify-content: center; font-size: 42px; }
    .movie-info { padding: 12px 14px; }
    .movie-info h3 { font-size: 15px; margin-bottom: 4px; }
    .movie-info span { font-size: 12px; color: #7b8497; }
    .player-layout { display: grid; grid-template-columns: 1fr 340px; height: 100vh; }
    .video-wrap { display: flex; flex-direction: column; background: #000; }
    #video { flex: 1; width: 100%; background: #000; outline: none; }
    .video-controls-bar { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: #10131a; border-top: 1px solid #1c212c; }
    .movie-title-label { flex: 1; font-size: 14px; color: #aab3c5; }
    .mini-btn { padding: 7px 14px; font-size: 13px; border-radius: 8px; border: 1px solid #2c3240; background: #1a1f2a; color: #cdd4e0; cursor: pointer; text-decoration: none; }
    .download-btn { color: #7bd88f; }
    .chat-panel { display: flex; flex-direction: column; background: #10131a; border-left: 1px solid #1c212c; height: 100vh; }
    .chat-header { padding: 14px 16px; font-weight: 600; border-bottom: 1px solid #1c212c; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
    .online { font-size: 12px; color: #7bd88f; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
    .chat-msg { display: flex; gap: 8px; font-size: 14px; align-items: flex-start; }
    .chat-msg img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .chat-msg .msg-name { font-weight: 600; color: #4f8cff; font-size: 12.5px; }
    .chat-msg .msg-text { color: #cdd4e0; word-break: break-word; line-height: 1.4; }
    .chat-form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #1c212c; }
    .chat-form input { flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid #2c3240; background: #151922; color: #fff; font-size: 14px; outline: none; }
    .chat-form button { padding: 0 16px; border: none; border-radius: 8px; background: #4f8cff; color: #fff; cursor: pointer; }
    @media (max-width: 820px) { .player-layout { grid-template-columns: 1fr; grid-template-rows: auto 45vh; height: auto; } .chat-panel { height: 45vh; } #video { max-height: 55vh; } }
  </style>
</head>
<body>

  <section id="loginScreen" class="screen active">
    <div class="login-card">
      <h1>🎬 Кинотеатр</h1>
      <p class="subtitle">Смотрите фильмы вместе с друзьями</p>
      <div class="avatar-preview" id="avatarPreview">?</div>
      <input type="text" id="nameInput" placeholder="Ваше имя" maxlength="20" />
      <label class="file-label">
        📷 Добавить аватарку
        <input type="file" id="avatarInput" accept="image/*" hidden />
      </label>
      <button id="enterBtn">Войти в кинотеатр</button>
    </div>
  </section>

  <section id="menuScreen" class="screen">
    <header class="menu-header">
      <div class="user-info">
        <img id="userAvatar" class="avatar-sm" alt="" />
        <span id="userName"></span>
      </div>
      <h2>Выберите фильм</h2>
    </header>
    <div class="movie-grid" id="movieGrid"></div>
  </section>

  <section id="playerScreen" class="screen">
    <div class="player-layout">
      <div class="video-wrap">
        <video id="video" controls playsinline></video>
        <div class="video-controls-bar">
          <button id="backBtn" class="mini-btn">← Назад</button>
          <span id="movieTitle" class="movie-title-label"></span>
          <a id="downloadBtn" class="mini-btn download-btn" download>⬇ Скачать</a>
        </div>
      </div>
      <aside class="chat-panel">
        <div class="chat-header">
          💬 Чат
          <span id="onlineCount" class="online"></span>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <form class="chat-form" id="chatForm">
          <input type="text" id="chatInput" placeholder="Написать..." autocomplete="off" />
          <button type="submit">➤</button>
        </form>
      </aside>
    </div>
  </section>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    // ТВОИ КЛЮЧИ УЖЕ ЗДЕСЬ:
    const firebaseConfig = {
      apiKey: "AIzaSyDhBgRVMchRoeMohH_25hMJQ6bW1H5bfk",
      authDomain: "cinema-6bf9d.firebaseapp.com",
      databaseURL: "https://cinema-6bf9d-default-rtdb.firebaseio.com",
      projectId: "cinema-6bf9d",
      storageBucket: "cinema-6bf9d.firebasestorage.app",
      messagingSenderId: "761664727186",
      appId: "1:761664727186:web:696691ac4706d8c1389e4b"
    };

    const MOVIES = [
      { id: "f1", title: "Демо-фильм", year: 2024, src: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4", poster: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/images/BigBuckBunny.jpg" },
      { id: "f2", title: "Sintel", year: 2010, src: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4", poster: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/images/Sintel.jpg" },
      { id: "f3", title: "Elephants Dream", year: 2006, src: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4", poster: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/images/ElephantsDream.jpg" }
    ];

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let user = { name: "", avatar: "" };
    let roomRef = null;
    let suppressSync = false;

    const loginScreen = document.getElementById("loginScreen");
    const menuScreen = document.getElementById("menuScreen");
    const playerScreen = document.getElementById("playerScreen");
    const nameInput = document.getElementById("nameInput");
    const avatarInput = document.getElementById("avatarInput");
    const avatarPreview = document.getElementById("avatarPreview");
    const enterBtn = document.getElementById("enterBtn");
    const movieGrid = document.getElementById("movieGrid");
    const video = document.getElementById("video");
    const chatMessages = document.getElementById("chatMessages");
    const chatForm = document.getElementById("chatForm");
    const chatInput = document.getElementById("chatInput");
    const onlineCountEl = document.getElementById("onlineCount");
    const movieTitleLabel = document.getElementById("movieTitle");
    const downloadBtn = document.getElementById("downloadBtn");
    const backBtn = document.getElementById("backBtn");

    let pendingAvatarDataUrl = "";

    avatarInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          canvas.width = canvas.height = 128;
          const ctx = canvas.getContext("2d");
          const min = Math.min(img.width, img.height);
          ctx.drawImage(img, (img.width - min) / 2, (img.height - min) / 2, min, min, 0, 0, 128, 128);
          pendingAvatarDataUrl = canvas.toDataURL("image/jpeg", 0.85);
          avatarPreview.style.backgroundImage = `url(${pendingAvatarDataUrl})`;
          avatarPreview.textContent = "";
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    enterBtn.addEventListener("click", () => {
      const name = nameInput.value.trim();
      if (!name) { nameInput.focus(); return; }
      user.name = name;
      user.avatar = pendingAvatarDataUrl || generateAvatar(name);
      document.getElementById("userName").textContent = name;
      document.getElementById("userAvatar").src = user.avatar;
      showScreen("menu");
      renderMovies();
    });

    nameInput.addEventListener("keydown", (e) => { if (e.key === "Enter") enterBtn.click(); });

    function generateAvatar(name) {
      const canvas = document.createElement("canvas");
      canvas.width = canvas.height = 128;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = ["#4f8cff","#7a5cff","#ff6b6b","#ffb84f","#4fd88c"][name.charCodeAt(0) % 5];
      ctx.fillRect(0, 0, 128, 128);
      ctx.fillStyle = "#fff";
      ctx.font = "bold 64px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(name[0].toUpperCase(), 64, 68);
      return canvas.toDataURL();
    }

    function showScreen(name) {
      [loginScreen, menuScreen, playerScreen].forEach(s => s.classList.remove("active"));
      if (name === "login") loginScreen.classList.add("active");
      if (name === "menu") menuScreen.classList.add("active");
      if (name === "player") playerScreen.classList.add("active");
    }

    function renderMovies() {
      movieGrid.innerHTML = "";
      MOVIES.forEach(m => {
        const card = document.createElement("div");
        card.className = "movie-card";
        card.innerHTML = `
          ${m.poster ? `<img class="movie-poster" src="${m.poster}">` : `<div class="movie-poster placeholder">🎬</div>`}
          <div class="movie-info"><h3>${m.title}</h3><span>${m.year || ""}</span></div>
        `;
        card.addEventListener("click", () => openPlayer(m));
        movieGrid.appendChild(card);
      });
    }

    backBtn.addEventListener("click", () => { leaveRoom(); showScreen("menu"); });

    function openPlayer(movie) {
      movieTitleLabel.textContent = movie.title;
      downloadBtn.href = movie.src;
      downloadBtn.setAttribute("download", movie.title);
      video.src = movie.src;
      video.load();
      chatMessages.innerHTML = "";
      onlineCountEl.textContent = "";
      showScreen("player");
      joinRoom(movie.id);
    }

    function joinRoom(movieId) {
      leaveRoom();
      roomRef = db.ref("rooms/" + movieId);
      const stateRef = roomRef.child("state");
      stateRef.on("value", (snap) => {
        const state = snap.val();
        if (!state || suppressSync) return;
        if (Math.abs(video.currentTime - state.time) > 1.5) video.currentTime = state.time;
        if (state.playing && video.paused) video.play().catch(()=>{});
        if (!state.playing && !video.paused) video.pause();
      });

      function pushState() {
        if (suppressSync || !roomRef) return;
        stateRef.set({ time: video.currentTime, playing: !video.paused });
      }
      video.addEventListener("play", pushState);
      video.addEventListener("pause", pushState);
      video.addEventListener("seeked", pushState);
      const ping = setInterval(() => { if (!video.paused) pushState(); }, 4000);

      const chatRef = roomRef.child("chat");
      chatRef.limitToLast(50).on("child_added", (snap) => addChatMessage(snap.val()));
      
      chatForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const text = chatInput.value.trim();
        if (!text) return;
        chatInput.value = "";
        chatRef.push({ name: user.name, avatar: user.avatar, text: text });
      });

      const presence = roomRef.child("online").push();
      presence.set({ name: user.name });
      presence.onDisconnect().remove();
      roomRef.child("online").on("value", (snap) => {
        onlineCountEl.textContent = `🟢 ${snap.numChildren()} онлайн`;
      });

      roomRef._cleanup = () => {
        stateRef.off(); chatRef.off(); presence.remove(); clearInterval(ping);
      };

      video.play().catch(()=>{});
    }

    function leaveRoom() {
      if (!roomRef) return;
      if (roomRef._cleanup) roomRef._cleanup();
      roomRef = null;
      suppressSync = true;
      video.pause(); video.removeAttribute("src"); video.load();
      setTimeout(() => suppressSync = false, 300);
    }

    function addChatMessage(msg) {
      const el = document.createElement("div");
      el.className = "chat-msg";
      el.innerHTML = `<img src="${msg.avatar}"><div><div class="msg-name">${msg.name}</div><div class="msg-text">${msg.text}</div></div>`;
      chatMessages.appendChild(el);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    showScreen("login");
  </script>
</body>
</html>
